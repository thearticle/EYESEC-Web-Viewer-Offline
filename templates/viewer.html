<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EYESEC Web Viewer Offline</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='viewer.css') }}">
  <script defer src="{{ url_for('static', filename='viewer.js') }}"></script>
</head>
<body data-connected="{{ 'true' if connected else 'false' }}"
      data-video-url="{{ url_for('video') }}"
      data-metrics-url="{{ url_for('metrics') }}"
      data-audio-url="{{ url_for('audio') }}">
  <img draggable="false" class="camera" id="eyesec" alt="EYESEC live CCTV">
  <div class="toolbar" aria-label="Viewer controls">
    <form class="panel" id="connectionForm" method="post" action="{{ url_for('connect') }}" autocomplete="off">
      <label>IP
        <input id="ip" name="ip" type="text" value="{{ camera_ip }}" placeholder="192.0.2.10"
               maxlength="64" spellcheck="false" required aria-label="Camera IP address">
      </label>
      <label>Port
        <input class="port" id="port" name="port" type="text" inputmode="numeric" value="{{ camera_port }}"
               maxlength="5" pattern="[0-9]{1,5}" required aria-label="RTSP port">
      </label>
      <label>User
        <input id="username" name="username" type="text" placeholder="admin or saved user"
               maxlength="128" spellcheck="false" aria-label="Username">
      </label>
      <label>Password
        <input id="password" name="password" type="password" autocomplete="new-password"
               maxlength="256" aria-label="Password">
      </label>
      <button type="button" id="showPassword" aria-label="Show password" aria-pressed="false">◉</button>
      <button type="submit" id="connect">Connect</button>
      <span id="connectionStatus" class="metric" role="status">Ready</span>
    </form>
    <div class="panel">
      <button id="audioToggle" aria-label="Toggle audio" aria-pressed="false" title="Mute or unmute">🔇</button>
      <input id="audioVolume" type="range" min="0" max="100" value="60" aria-label="Volume">
      <span class="metric" id="volumeValue">60%</span>
      <button id="boostToggle" aria-label="Toggle boost" aria-pressed="true" title="Toggle gain">⚡</button>
      <input id="boostLevel" type="range" min="0" max="40" value="30" aria-label="Boost decibels">
      <span class="metric" id="boostValue">30 dB</span>
      <select id="quality" aria-label="Stream quality">
        <option value="major">HIGH</option>
        <option value="minor">LOW</option>
      </select>
      <span id="fps" class="metric" title="Decoded frames per second">-- FPS</span>
      <span id="ping" class="metric" title="TCP connection time to the camera">-- ms</span>
      <span id="clock" class="metric"></span>
      <button id="fullscreen" aria-label="Enter fullscreen" title="Fullscreen">⛶</button>
      <span id="audioStatus" class="metric" role="status" hidden></span>
      <audio id="cameraAudio" preload="none"></audio>
    </div>
  </div>
</body>
</html>
